name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Syntax check and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check every app script for syntax errors
        run: |
          for f in app/js/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Run the unit tests
        run: npm test
